# Local development stack. Usage:
#   docker compose up -d postgres redis        # infra only (run apps with pnpm dev)
#   docker compose --profile app up --build    # full stack in containers
name: hilatech-ai-assistant

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hta-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hilatech
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hilatech']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hta-redis
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: hta-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hilatech?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 10

  workers:
    profiles: ['app']
    build:
      context: .
      dockerfile: infrastructure/docker/workers.Dockerfile
    container_name: hta-workers
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hilatech?schema=public
      REDIS_URL: redis://redis:6379
      WORKERS_HEALTH_PORT: 4100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4100/health']
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    container_name: hta-web
    environment:
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
