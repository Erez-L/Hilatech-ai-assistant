# Production-style compose template (single host): the demo / early-pilot deployment.
# Images come from GHCR via .github/workflows/deploy.yml. GITHUB_REPOSITORY must be lowercase (owner/repo).
# Copy next to a production .env (never commit it) and run:
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
name: hilatech-ai-assistant

x-common-env: &common-env
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: redis://redis:6379
  # Uploaded documents: one volume shared by the API (writes) and the workers (read and process).
  # Ignored when STORAGE_DRIVER=s3 is set in .env.
  STORAGE_LOCAL_PATH: /data/uploads

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hilatech}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY}/api:${IMAGE_TAG:-latest}
    # The API image carries a migration bundle in /app/migrate (see infrastructure/docker/api.Dockerfile).
    working_dir: /app/migrate
    command: ['node', 'node_modules/prisma/build/index.js', 'migrate', 'deploy']
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: ghcr.io/${GITHUB_REPOSITORY}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common-env
      API_PORT: 4000
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 10

  workers:
    image: ghcr.io/${GITHUB_REPOSITORY}/workers:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common-env
      WORKERS_HEALTH_PORT: 4100
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: ghcr.io/${GITHUB_REPOSITORY}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy

  # Reverse proxy terminating TLS. Caddy obtains certificates automatically for the configured domains.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # The Caddyfile reads the public hostname from this variable.
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

volumes:
  postgres-data:
  redis-data:
  uploads:
  caddy-data:
  caddy-config:
